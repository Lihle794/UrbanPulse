[project]
name = "urbanpulse"
version = "0.1.0"
description = "Urban mobility data engineering platform for Johannesburg"
requires-python = ">=3.12"

dependencies = [
    "confluent-kafka>=2.6,<3.0",
    "jsonschema[format]>=4.23,<5.0",
    "pyspark==4.0.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0"
]

[tool.setuptools.packages.find]
include = ["producers*"]