[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanpulse"
version = "0.1.0"
description = "Urban mobility data engineering platform for Johannesburg"
requires-python = ">=3.12"

dependencies = [
    "confluent-kafka>=2.6,<3.0"
]

[tool.setuptools.packages.find]
include = ["producers*"]